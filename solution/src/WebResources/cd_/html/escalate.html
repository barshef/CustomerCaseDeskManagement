<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Escalate case</title>
<!--
  CaseDesk escalate dialog (web resource cd_/html/escalate.html).
  Opened by CaseDesk.Ribbon.escalate with Xrm.Navigation.navigateTo (target 2), data "token=...&case=...".
  Web resource dialogs cannot return a value, so the result is written to sessionStorage[token]
  as JSON { cancelled: bool, reason: string } and the dialog closes itself.
-->
<style>
  html, body { height: 100%; }
  body { font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
         font-size: 14px; margin: 0; padding: 16px; box-sizing: border-box; color: #242424; background: #fff;
         display: flex; flex-direction: column; gap: 12px; }
  p { margin: 0; color: #424242; }
  label { font-weight: 600; }
  textarea { flex: 1; min-height: 110px; font: inherit; padding: 8px; border: 1px solid #d1d1d1; border-radius: 4px; resize: none; }
  textarea:focus { outline: 2px solid #0f6cbd; border-color: transparent; }
  .counter { font-size: 12px; color: #616161; text-align: right; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  button { font: inherit; padding: 5px 16px; border-radius: 4px; border: 1px solid #d1d1d1; background: #fff; cursor: pointer; min-width: 96px; }
  button.primary { background: #0f6cbd; color: #fff; border-color: #0f6cbd; }
  button:focus-visible { outline: 2px solid #0f6cbd; outline-offset: 2px; }
</style>
</head>
<body>
  <p id="intro">The case will be set to Critical, assigned to the supervisor team and an internal note will be added.</p>
  <label for="reason">Reason</label>
  <textarea id="reason" maxlength="500" placeholder="Why does this case need a supervisor? (optional)"></textarea>
  <div class="counter"><span id="count">0</span>/500</div>
  <div class="actions">
    <button id="cancel" type="button">Cancel</button>
    <button id="ok" class="primary" type="button">Escalate</button>
  </div>
<script>
(function () {
  "use strict";
  var outer = new URLSearchParams(window.location.search);
  var params = new URLSearchParams(outer.get("data") || outer.get("Data") || "");
  var token = params.get("token");
  var caseNumber = params.get("case");
  var reason = document.getElementById("reason");
  var count = document.getElementById("count");

  if (caseNumber) {
    document.getElementById("intro").textContent = "Case " + caseNumber +
      " will be set to Critical, assigned to the supervisor team and an internal note will be added.";
  }

  function finish(result) {
    if (token) {
      try { window.sessionStorage.setItem(token, JSON.stringify(result)); } catch (e) { /* storage blocked: treated as cancel */ }
    }
    window.close();
  }

  reason.addEventListener("input", function () { count.textContent = String(reason.value.length); });
  reason.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { finish({ cancelled: false, reason: reason.value.trim() }); }
    if (e.key === "Escape") { finish({ cancelled: true }); }
  });
  document.getElementById("cancel").addEventListener("click", function () { finish({ cancelled: true }); });
  document.getElementById("ok").addEventListener("click", function () { finish({ cancelled: false, reason: reason.value.trim() }); });
  reason.focus();
})();
</script>
</body>
</html>
