# CaseDesk CI (FR14, research R16).
# Builds and tests every code component, then packs the Dataverse solution (unmanaged + managed)
# and uploads both zips as the "solution" artifact.
#
# Triggers:
#   - pull_request: every PR (build + test only, nothing is deployed).
#   - push: every branch except master (develop and feature branches run here).
#   - workflow_call: deploy-uat.yml calls this workflow on push to master, so master gets exactly one
#     CI run and the deploy job can `needs:` it and read the artifact from the same run.
#     (That is why master is excluded from `push` here: it would otherwise run CI twice.)
name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# One CI run per ref; a newer push cancels the older run, except on master where a run may be
# part of a deployment. When called from deploy-uat the group still differs from the caller's
# ("deploy-uat"), which avoids the reusable-workflow concurrency deadlock.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  plugins:
    name: Plugins (net462) - test
    # net462 test host needs .NET Framework 4.8, which windows-latest ships with.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # 8.x as the baseline; 10.x because the repo is developed on SDK 10 (slnx, newest C#).
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-plugins-${{ hashFiles('plugins/**/*.csproj', 'tests/CaseDesk.Plugins.Tests/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-plugins-

      - name: Test plugins
        run: dotnet test tests/CaseDesk.Plugins.Tests/CaseDesk.Plugins.Tests.csproj -c Release --logger "trx;LogFileName=plugins.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-plugins
          path: TestResults/*.trx
          if-no-files-found: ignore

  functions:
    name: Functions (net8) - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-functions-${{ hashFiles('functions/**/*.csproj', 'tests/CaseDesk.Functions.Tests/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-functions-

      - name: Test functions
        run: dotnet test tests/CaseDesk.Functions.Tests/CaseDesk.Functions.Tests.csproj -c Release --logger "trx;LogFileName=functions.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-functions
          path: TestResults/*.trx
          if-no-files-found: ignore

  pcf:
    name: PCF SlaBadge - test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pcf/SlaBadge
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pcf/SlaBadge/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  solution:
    name: Solution - pack (unmanaged + managed)
    # Tests gate packing (constitution IV): only pack when plugin and PCF jobs are green.
    needs: [plugins, pcf]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pcf/SlaBadge/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-solution-${{ hashFiles('solution/*.cdsproj', 'plugins/**/*.csproj', 'pcf/**/*.pcfproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-solution-

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      # The cdsproj builds the referenced PCF project; install its packages from the lock file first.
      - name: Install PCF packages
        working-directory: pcf/SlaBadge
        run: npm ci

      - name: Build solution
        run: dotnet build solution/CaseDesk.cdsproj -c Release

      - name: Upload solution zips
        uses: actions/upload-artifact@v7
        with:
          name: solution
          path: |
            solution/bin/Release/CaseDesk.zip
            solution/bin/Release/CaseDesk_managed.zip
          if-no-files-found: error
          retention-days: 30
